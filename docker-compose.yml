services:
  docuwaves:
    build: .
    container_name: docuwaves
    restart: unless-stopped
    ports:
      - "8091:8000"
    env_file:
      - .env
    volumes:
      # The content repo's working clone lives under here too
      # (CONTENT_REPO_PATH defaults to /data/content-repo) -- same volume as
      # the SQLite DB and the OIDC session secret, so it survives container
      # recreates and is only ever cloned once, not on every restart.
      - ./data:/data

  # Optional, only started with `docker compose --profile postgres up -d`.
  # Only useful together with a matching DATABASE_URL in .env (pointing at
  # this service's hostname, "postgres"). Without --profile postgres,
  # `docker compose up -d` behaves exactly as before: just the docuwaves
  # container, a single SQLite file under ./data.
  postgres:
    image: postgres:16-alpine
    container_name: docuwaves-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: docuwaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: docuwaves
    volumes:
      - ./pgdata:/var/lib/postgresql/data
