# A preview of the documentation for every pull request that changes docs/:
# the folder is built into a static website exactly as DocuWaves would show
# it (`python -m app.cli preview-site`, backend/app/cli.py) -- in a throwaway
# instance inside the job, with no token, no server and nothing published.
#
# The result is the "docs-preview" artifact of the run (open index.html),
# and the job summary lists what the import warns about: links that point
# nowhere, images that are missing, files that were not taken over -- the
# same warnings the real sync on main would give, before the merge.
name: Docs preview

on:
  pull_request:
    paths: ["docs/**", "backend/app/services/importer.py", ".github/workflows/docs-preview.yml"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build the preview
        working-directory: backend
        run: python -m app.cli preview-site ../docs ../preview.zip --name DocuWaves --summary ../preview.json

      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("preview.json"))
          print(f"### Docs preview: {r['pages']} pages")
          print()
          print("Download the **docs-preview** artifact of this run and open `index.html`.")
          if r["warnings"]:
              print()
              print("| File | Warning |")
              print("|---|---|")
              for w in r["warnings"]:
                  print(f"| `{w['source']}` | {w['message'].replace('|', '\\|')} |")
          else:
              print()
              print("No warnings: every link and image resolves.")
          PY
          mkdir -p preview && cd preview && unzip -q ../preview.zip

      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: preview/
          retention-days: 14
