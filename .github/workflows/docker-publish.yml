name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly rebuild with no code change. The base image ships a Debian
  # userland, and most of what a container scan reports lives there rather
  # than in this project's own dependencies -- so those findings only clear
  # when the image is built again after Debian publishes fixes. Without
  # this, an image sits unchanged for as long as nobody pushes, quietly
  # accumulating everything that was patched upstream in the meantime.
  # Sunday 03:00 UTC, away from any working day.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; github.repository preserves the
      # repo's actual case ("Syntaxlab-dev/DocuWaves"), so it can't be used
      # directly -- computed once here instead of relying on any implicit
      # lowercasing elsewhere.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
