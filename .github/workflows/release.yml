name: Release

# Pushing a tag like v1.0.0 makes it a release: the image (docker-publish.yml,
# which also moves `stable` for anything that is not a pre-release), a frozen
# version of DocuWaves' own documentation (docs.yml), and -- here -- the
# GitHub release page with notes from the merged pull requests since the
# last one, with the installer and its checksum attached.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          cp installer/install.sh install.sh
          sha256sum install.sh > install.sh.sha256
          gh release create "$TAG" --verify-tag --generate-notes --title "DocuWaves ${TAG#v}" $prerelease \
            install.sh install.sh.sha256
