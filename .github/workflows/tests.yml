name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The same version the runtime image is built on, so a difference
          # between what CI proved and what ships cannot come from the
          # interpreter.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # GitPython refuses to import without a git executable, and the
      # services under test import it transitively. The runner has one; this
      # is here so the reason is written down if a leaner image ever does not.
      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # There is no frontend test suite yet. The build runs the TypeScript
      # compiler over the whole app, which is what catches the mistakes a
      # reviewer of a UI change most often makes -- a renamed prop, a value
      # that can be null.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
