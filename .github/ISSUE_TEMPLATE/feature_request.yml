name: Feature request
description: Suggest something DocuWaves should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you write: [Scope and limitations](https://docs.docuwaves.app/p/docuwaves/pages/scope-and-limitations)
        lists what DocuWaves deliberately does not attempt.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
